<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard CRM (Secure)</title>
<script>var GH_OWNER="";var GH_REPO="";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<h2>CRM Dashboard (Secure Version)</h2>

<button onclick="saveToGitHub()">💾 Сохранить в GitHub</button>
<button onclick="openSettings()">⚙️ GitHub</button>

<script>
let state = { test: "ok" };

let ghConfig = JSON.parse(localStorage.getItem('gh_config') || '{}');

function openSettings(){
  const owner = prompt('Owner', ghConfig.owner || '');
  const repo = prompt('Repo', ghConfig.repo || '');
  const token = prompt('Token', ghConfig.token || '');

  ghConfig = { owner, repo, token, path: 'data.json' };
  localStorage.setItem('gh_config', JSON.stringify(ghConfig));
}

async function saveToGitHub(){
  if(!ghConfig.token) return alert('Нет токена');

  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;

  let sha;
  try{
    const r = await fetch(url, { headers: { Authorization:`token ${ghConfig.token}` } });
    if(r.ok){ const d = await r.json(); sha = d.sha; }
  }catch(e){}

  const content = btoa(JSON.stringify(state,null,2));

  await fetch(url,{
    method:'PUT',
    headers:{
      Authorization:`token ${ghConfig.token}`,
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      message:'update data',
      content,
      ...(sha?{sha}:{})
    })
  });

  alert('Сохранено');
}
</script>
</body>
</html>
