<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз продаж — Май 2026</title>
<script>var GH_OWNER="";var GH_REPO="";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

<h2>Прогноз продаж (CRM версия)</h2>

<button onclick="toggleEditor()">✏️ Редактировать</button>
<button onclick="saveToGitHub()">💾 Сохранить</button>
<button onclick="openSettings()">⚙️ GitHub</button>

<pre id="output"></pre>

<script>
// ================= STATE =================
let state = {
  totalPlan: 1650000,
  managers: []
};

// ================= CONFIG =================
let ghConfig = JSON.parse(localStorage.getItem('gh_config') || '{}');

function openSettings(){
  const owner = prompt('Owner', ghConfig.owner || '');
  const repo = prompt('Repo', ghConfig.repo || '');
  const token = prompt('Token', ghConfig.token || '');

  ghConfig = { owner, repo, token, path: 'data.json' };
  localStorage.setItem('gh_config', JSON.stringify(ghConfig));
}

// ================= GITHUB =================
async function getFileSHA(){
  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
  const r = await fetch(url, { headers:{ Authorization:`token ${ghConfig.token}` }});
  if(!r.ok) return null;
  const d = await r.json();
  return d.sha;
}

async function saveToGitHub(){
  if(!ghConfig.token) return alert('Сначала настрой GitHub');

  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;

  const sha = await getFileSHA();

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))));

  const res = await fetch(url,{
    method:'PUT',
    headers:{
      Authorization:`token ${ghConfig.token}`,
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      message:'update dashboard data',
      content,
      ...(sha?{sha}:{})
    })
  });

  if(res.ok){
    alert('Сохранено в GitHub ✅');
  }else{
    alert('Ошибка ❌');
  }
}

// ================= UI =================
function toggleEditor(){
  const val = prompt('Введите новое значение плана', state.totalPlan);
  if(val) state.totalPlan = Number(val);
  render();
}

function render(){
  document.getElementById('output').textContent = JSON.stringify(state,null,2);
}

render();
</script>

</body>
</html>
